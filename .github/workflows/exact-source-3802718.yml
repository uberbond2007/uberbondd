          git merge-base --is-ancestor c09537543ee438941cdee0e525519042e292b39f HEAD
          git rev-parse HEAD HEAD^{tree} | tee /tmp/exact-source-receipts/source.txt
          git status --porcelain | tee /tmp/exact-source-receipts/status.txt
          git diff --name-only 3802718424b8fe3be50c35c79ca8c8d34e652532 HEAD | tee /tmp/exact-source-receipts/change-set.txt
          git ls-tree HEAD src/store.mjs tests/json-store-save-race.test.mjs | tee /tmp/exact-source-receipts/repair-blobs.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: |
          set -o pipefail
          node --version | tee /tmp/exact-source-receipts/node.txt
          npm ci 2>&1 | tee /tmp/exact-source-receipts/install.log
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Run postgres exact-source gate
        run: |
          set -o pipefail
          set +e
          npm run test:postgres-real 2>&1 | tee /tmp/exact-source-receipts/postgres.log
          result=${PIPESTATUS[0]}
          echo "$result" > /tmp/exact-source-receipts/postgres-exit-code.txt
          exit "$result"
        env:
          OMNIA_V9_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/uberbond
      - name: Preserve exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-source-postgres-4d5d4469dddf349797ebdacf5ba106fd9843fbce
          path: /tmp/exact-source-receipts
          retention-days: 30
