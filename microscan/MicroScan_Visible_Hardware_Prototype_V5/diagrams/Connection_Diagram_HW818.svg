<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#102333">MicroScan V5 connection diagram — HW-818 candidate (no added wiring)</text>
  <text x="20" y="48" fill="#B3261E" font-weight="bold">Header order read from the retailer photo. Internal nets marked (?) are UNVERIFIED for this board.</text>
  <rect x="20" y="90" width="170" height="90" rx="8" fill="#eef4f6" stroke="#102333"/>
  <text x="105" y="120" text-anchor="middle" font-weight="bold">Computer USB-A</text>
  <text x="105" y="140" text-anchor="middle">or certified 5 V</text>
  <text x="105" y="158" text-anchor="middle">power bank (power only)</text>
  <line x1="190" y1="135" x2="300" y2="135" stroke="#102333" stroke-width="4"/>
  <text x="245" y="125" text-anchor="middle" fill="#6A7787">visible USB cable</text>
  <text x="245" y="155" text-anchor="middle" fill="#6A7787">VBUS D− D+ GND</text>
  <rect x="300" y="70" width="460" height="400" rx="10" fill="#f7f7f2" stroke="#B46A19" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="530" y="92" text-anchor="middle" font-weight="bold" fill="#B46A19">HW-818 single PCB (as photographed)</text>
  <rect x="320" y="110" width="120" height="50" rx="5" fill="#fff" stroke="#102333"/>
  <text x="380" y="132" text-anchor="middle">Micro-USB</text><text x="380" y="149" text-anchor="middle">socket</text>
  <rect x="320" y="185" width="120" height="50" rx="5" fill="#fff" stroke="#102333"/>
  <text x="380" y="207" text-anchor="middle">5 V → 3.3 V</text><text x="380" y="224" text-anchor="middle">regulator</text>
  <rect x="320" y="260" width="120" height="60" rx="5" fill="#fff" stroke="#102333"/>
  <text x="380" y="283" text-anchor="middle">USB-UART</text><text x="380" y="300" text-anchor="middle">bridge (?)</text>
  <rect x="320" y="345" width="120" height="50" rx="5" fill="#fff" stroke="#102333"/>
  <text x="380" y="367" text-anchor="middle">RST / FLASH</text><text x="380" y="384" text-anchor="middle">buttons</text>
  <rect x="490" y="150" width="130" height="220" rx="6" fill="#e9eef0" stroke="#102333"/>
  <text x="555" y="175" text-anchor="middle" font-weight="bold">ESP-32S</text>
  <text x="555" y="200" text-anchor="middle">U0R / U0T</text>
  <text x="555" y="225" text-anchor="middle">IO0, EN</text>
  <text x="555" y="255" text-anchor="middle">camera DVP +</text><text x="555" y="272" text-anchor="middle">SCCB (?)</text>
  <text x="555" y="302" text-anchor="middle">GPIO4 (?)</text>
  <text x="555" y="340" text-anchor="middle" fill="#027E76">radio unused</text><text x="555" y="357" text-anchor="middle" fill="#027E76">SD unused</text>
  <line x1="380" y1="160" x2="380" y2="185" stroke="#102333" stroke-width="2"/>
  <line x1="440" y1="210" x2="490" y2="190" stroke="#102333" stroke-width="2"/>
  <line x1="350" y1="160" x2="350" y2="260" stroke="#6A7787" stroke-dasharray="3 3"/>
  <line x1="440" y1="285" x2="490" y2="200" stroke="#102333" stroke-width="2"/>
  <line x1="440" y1="370" x2="490" y2="228" stroke="#102333"/>
  <rect x="660" y="130" width="85" height="60" rx="5" fill="#fff" stroke="#102333"/>
  <text x="702" y="155" text-anchor="middle">24-pin FPC</text><text x="702" y="172" text-anchor="middle">connector</text>
  <line x1="620" y1="262" x2="660" y2="165" stroke="#102333" stroke-width="2"/>
  <rect x="660" y="285" width="85" height="50" rx="5" fill="#fffbe6" stroke="#B46A19" stroke-width="2"/>
  <text x="702" y="306" text-anchor="middle" font-weight="bold">white LED</text><text x="702" y="323" text-anchor="middle">camera face</text>
  <line x1="620" y1="300" x2="660" y2="308" stroke="#B46A19" stroke-width="2"/>
  <rect x="800" y="120" width="160" height="80" rx="8" fill="#eef4f6" stroke="#102333"/>
  <text x="880" y="148" text-anchor="middle" font-weight="bold">RHYX M21-45</text>
  <text x="880" y="167" text-anchor="middle">camera head</text><text x="880" y="186" text-anchor="middle">factory flex, uncut</text>
  <line x1="745" y1="160" x2="800" y2="160" stroke="#102333" stroke-width="3"/>
  <rect x="800" y="270" width="160" height="80" rx="8" fill="#fffbe6" stroke="#B46A19" stroke-width="2"/>
  <text x="880" y="298" text-anchor="middle" font-weight="bold">CAPTURE INDICATOR</text>
  <text x="880" y="317" text-anchor="middle">ON before exposure,</text><text x="880" y="336" text-anchor="middle">until last byte is sent</text>
  <line x1="745" y1="310" x2="800" y2="310" stroke="#B46A19" stroke-width="2"/>
  <text x="320" y="425" fill="#102333">Header (left→right from antenna end):  5V GND IO12 IO13 IO15 IO14 IO2 IO4   |   3V3 IO16 IO0 GND VCC U0R U0T GND</text>
  <text x="320" y="447" fill="#6A7787">All 16 header pins are left unconnected. They only locate the board in the carrier's blind troughs.</text>
  <text x="20" y="495" fill="#102333">Data path: operator types CAPTURE → firmware lights indicator → one frame → MSJ1 packet over the same cable → host verifies CRC and writes one JPEG.</text>
  <text x="20" y="512" fill="#B3261E">Not connected, not supported: any phone, Wi-Fi, Bluetooth, SD card, battery, external trigger.</text>
</svg>
