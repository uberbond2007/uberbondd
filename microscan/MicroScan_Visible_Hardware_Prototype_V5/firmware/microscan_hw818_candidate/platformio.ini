; MicroScan V5 candidate firmware for the HW-818 "ESP32-CAM with Micro-USB" board.
; Toolchain is pinned. Nothing here uploads: no serial port is configured for flashing and there is
; no environment that produces a capture-capable image while the source gates are 0.
;
;   pio run -e hw818_capture_GATED          -> MUST FAIL with two #error lines (proves the gates)
;   pio run -e hw818_bringup_capture_locked -> compiles; CAPTURE is refused at run time;
;                                              INFO (sensor PID, PSRAM) and LAMPTEST work.
[platformio]
default_envs = hw818_bringup_capture_locked

[env]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:hw818_capture_GATED]

[env:hw818_bringup_capture_locked]
build_flags = ${env.build_flags} -DMICROSCAN_BRINGUP_CAPTURE_LOCKED=1
